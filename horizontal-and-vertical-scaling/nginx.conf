# ==============================================================================
# НАСТРОЙКИ РАБОЧИХ ПРОЦЕССОВ / WORKER PROCESSES SETTINGS
# ==============================================================================
events {
    # Максимальное количество одновременных соединений, которое может держать один рабочий процесс.
    # Поскольку Nginx работает как прокси, на один запрос пользователя тратится два соединения (клиент-Nginx и Nginx-Go).
    # The maximum number of simultaneous connections that a single worker process can open.
    # Since Nginx acts as a proxy, one client request consumes two connections (client-to-nginx and nginx-to-go).
    worker_connections 1024;
}

# ==============================================================================
# НАСТРОЙКИ HTTP ПРОТОКОЛА / HTTP PROTOCOL CONFIGURATION
# ==============================================================================
http {
    # Явно указываем адрес встроенного DNS-сервера Docker Swarm (127.0.0.11).
    # ipv6=off — отключает поиск IPv6 адресов, что критично для стабильной работы сетевого стека Docker Desktop на Windows.
    # valid=5s — кэшировать результаты DNS-запросов глобально не более чем на 5 секунд.
    # Explicitly sets the address of the built-in Docker Swarm DNS server (127.0.0.11).
    # ipv6=off — disables IPv6 lookups, which is critical for network stability in Docker Desktop on Windows.
    # valid=5s — caches DNS query results globally for no longer than 5 seconds.
    resolver 127.0.0.11 ipv6=off valid=5s;

    # Конфигурация виртуального хоста.
    # Virtual host configuration.
    server {
        # Слушаем входящий HTTP-трафик на стандартном 80 порту.
        # Listen for incoming HTTP traffic on the standard port 80.
        listen 80;

        # ----------------------------------------------------------------------
        # ПРОКСИРОВАНИЕ КОРНЕВОГО МАРШРУТА / PROXYING THE ROOT ROUTE
        # ----------------------------------------------------------------------
        location / {
            # Переопределяем параметры DNS-резолвера для этого конкретного эндпоинта.
            # Обновляем кэш каждые 2 секунды (valid=2s), чтобы мгновенно замечать появление новых контейнеров после автоскейлинга.
            # Overrides DNS resolver parameters for this specific location.
            # Refreshes the cache every 2 seconds (valid=2s) to instantly discover new containers added by the autoscaler.
            resolver 127.0.0.11 ipv6=off valid=2s;
            
            # Использование префикса "tasks." заставляет DNS Docker Swarm вернуть список IP-адресов ВСЕХ живых реплик сервиса (DNS Round Robin),
            # вместо одного виртуального IP (VIP) всего сервиса.
            # Сохранение имени в переменную $backend_name принуждает Nginx пересчитывать DNS-имя на лету при каждом запросе.
            # Using the "tasks." prefix forces Docker Swarm DNS to return a list of individual IP addresses of ALL live replicas (DNS Round Robin),
            # instead of a single Virtual IP (VIP) assigned to the service.
            # Saving the name into the $backend_name variable forces Nginx to re-resolve the DNS name on the fly for every single request.
            set $backend_name "tasks.go-server"; 
            
            # Перенаправляем запрос на динамический пул адресов наших Go-сервисов на порт 8080.
            # Forwards the request to the dynamic address pool of our Go servers on port 8080.
            proxy_pass http://$backend_name:8080;
            
            # Пробрасываем оригинальный заголовок Host, пришедший от пользователя, в Go-сервис.
            # Forwards the original Host header sent by the user down to the Go service.
            proxy_set_header Host $host;
            
            # Передаем реальный IP-адрес клиента в заголовок X-Real-IP, чтобы Go-сервер знал, кто совершил запрос.
            # Passes the client's real IP address in the X-Real-IP header, so the Go server knows who made the request.
            proxy_set_header X-Real-IP $remote_addr;
            
            # Отключаем постоянные (Keep-Alive) соединения между Nginx и бэкендом на этом маршруте.
            # Это заставляет Nginx закрывать TCP-сессию после каждого ответа и при новом запросе заново выбирать случайный IP из списка tasks.
            # Благодаря этому балансировка Round Robin работает честно и запросы не "прилипают" к одному контейнеру.
            # Disables persistent (Keep-Alive) connections between Nginx and the backend for this location.
            # This forces Nginx to close the TCP session after each response, forcing a fresh IP selection from the tasks list on the next request.
            # This ensures fair Round Robin load balancing and prevents requests from "sticking" to a single container.
            proxy_set_header Connection "";
            
            # Явно включаем протокол HTTP/1.1 (необходим для корректного сброса заголовка Connection).
            # Explicitly enables HTTP/1.1 (required for the Connection header override to work correctly).
            proxy_http_version 1.1;
        }

        # ----------------------------------------------------------------------
        # ПРОВЕРКА ЗДОРОВЬЯ БАЛАНСИРОВЩИКА / LOAD BALANCER HEALTHCHECK
        # ----------------------------------------------------------------------
        location /health {
            # Быстрый ответ с кодом 200 для внешних проверок жизнеспособности самого Nginx.
            # Fast response with status 200 for external uptime monitors verifying Nginx health.
            return 200 "OK";
        }
    }
}
