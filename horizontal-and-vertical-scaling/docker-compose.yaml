services:
  go-server:
    image: my-go-app:latest  # Добавьте это!
    build: .
    healthcheck:
      # Проверка через открытие TCP-порта (не требует curl)
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    hostname: server-{{.Task.Slot}}
    environment:
      - SERVER_ID={{.Task.Slot}}
      - PORT=8080
      - DATABASE_URL=postgres://user:password@postgres-master:5432/myapp?sslmode=disable
      - READ_DATABASE_URL=postgres://user:password@postgres-slave:5432/myapp?sslmode=disable
      - REDIS_URL=redis:6379
      - KAFKA_BROKER=kafka:9092
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  postgres-master:
    image: bitnami/postgresql:latest
    networks:
      - app_network
    user: root # Даем права на исправление владельца папки
    environment:
      - BITNAMI_DEBUG=true # Включит подробные логи, если упадет
      - POSTGRESQL_PBA_METHOD=md5 # Метод аутентификации
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=myapp
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - ALLOW_EMPTY_PASSWORD=yes # Чтобы Bitnami не ругался на пустой пароль админа
    volumes:
      - postgres_master_data:/bitnami/postgresql
    deploy:
      placement:
        constraints: [node.role == manager]

  postgres-slave:
    image: bitnami/postgresql:latest
    networks:
      - app_network
    environment:
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=myapp
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
    deploy:
      replicas: 1 # Можно масштабировать для чтения!
    depends_on:
      - postgres-master

  load-balancer:
    image: nginx:alpine
    container_name: nginx_lb
    networks:
      - app_network
    ports:
      - "80:80"
    depends_on:
      - go-server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # :ro добавит режим "только чтение"
    restart: unless-stopped

  autoscaler:
    build: ./autoscaler
    image: my-autoscaler:latest
    networks:
      - app_network
    ports:
      - "8888:8888"  # Пробрасываем порт наружу
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager

  prometheus:
    image: prom/prometheus
    networks:
      - app_network
    ports:
      - "9090:9090"  # Добавьте эту строку
    configs:
      - source: prom_conf
        target: /etc/prometheus/prometheus.yml
      - source: prom_alerts
        target: /etc/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    deploy:
      replicas: 1

  alertmanager:
    image: prom/alertmanager
    networks:
      - app_network
    configs:
      - source: alert_conf
        target: /etc/alertmanager/alertmanager.yml
    deploy:
      replicas: 1
  redis:
    image: redis:7-alpine
    networks:
      - app_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    # Если захочешь, чтобы кэш сохранялся после перезагрузки:
    volumes:
     - redis_data:/data

  grafana:
    image: grafana/grafana-oss:latest
    networks:
      - app_network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль для входа
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  kafka:
    image: apache/kafka:3.7.0
    networks:
      - app_network
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  kafka-init:
    image: apache/kafka:3.7.0
    networks:
      - app_network
    command: >
      sh -c "
      echo 'Waiting for Kafka...';
      while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events --partitions 3 --replication-factor 1;
      echo 'Topic events created!';"
    deploy:
      restart_policy:
        condition: on-failure # Если упадет, пока Kafka грузится — перезапустится

  producer:
      build: ./producer
      image: my-producer:latest
      networks:
        - app_network
      environment:
        - KAFKA_BROKER=kafka:9092
        - TRANSACTIONAL_ID=producer-1
      deploy:
        replicas: 1
      depends_on:
        - kafka

volumes:
  postgres_master_data:
  redis_data:

networks:
  app_network:
    driver: overlay
    attachable: true

configs:
  prom_conf:
    file: ./prometheus.yml
  prom_alerts:
    file: ./alerts.yml
  alert_conf:
    file: ./alertmanager.yml