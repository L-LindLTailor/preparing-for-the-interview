services:
  go-server:
    image: my-go-app:latest  # Добавьте это!
    build: .
    healthcheck:
      # Проверка через открытие TCP-порта (не требует curl)
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    hostname: server-{{.Task.Slot}}
    environment:
      - SERVER_ID={{.Task.Slot}}
      - PORT=8080
      - DATABASE_URL=postgres://user:password@postgres:5432/myapp?sslmode=disable
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    networks:
      - app_network
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  load-balancer:
    image: nginx:alpine
    container_name: nginx_lb
    networks:
      - app_network
    ports:
      - "80:80"
    depends_on:
      - go-server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # :ro добавит режим "только чтение"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: overlay
    attachable: true
