services:
  # Три экземпляра Go-сервера на разных IP
  server1:
    build: .
    container_name: go-server1
    hostname: server1
    environment:
      - SERVER_ID=1
      - PORT=8080
      - DATABASE_URL=postgres://user:password@postgres:5432/myapp?sslmode=disable
    networks:
      app_network:
        ipv4_address: 172.20.0.11
    restart: unless-stopped
    expose:
      - "8080"

  server2:
    build: .
    container_name: go-server2
    hostname: server2
    environment:
      - SERVER_ID=2
      - PORT=8080
      - DATABASE_URL=postgres://user:password@postgres:5432/myapp?sslmode=disable
    networks:
      app_network:
        ipv4_address: 172.20.0.12
    restart: unless-stopped
    expose:
      - "8080"

  server3:
    build: .
    container_name: go-server3
    hostname: server3
    environment:
      - SERVER_ID=3
      - PORT=8080
      - DATABASE_URL=postgres://user:password@postgres:5432/myapp?sslmode=disable
    networks:
      app_network:
        ipv4_address: 172.20.0.13
    restart: unless-stopped
    expose:
      - "8080"

  # Единый сервер PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    hostname: postgres
    networks:
      - app_network
    restart: unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Сервер балансировщика (Nginx)
  load-balancer:
    image: nginx:alpine
    container_name: nginx_lb
    hostname: load-balancer
    networks:
      - app_network
    ports:
      - "80:80"
    depends_on:
      - server1
      - server2
      - server3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
